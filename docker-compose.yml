services:
  api:
    build: .
    image: outage-report-api:latest
    ports:
      - "8000:8000"
    environment:
      OUTAGE_DB_PATH: /data/outage.db
    volumes:
      - outage-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  outage-data:
